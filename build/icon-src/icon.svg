<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- OiShi-e! icon (original): horned round creature silhouette + single cyan AR ring. -->
  <!-- transparent background; creature centered for launcher/mipmap/ico use. -->
  <defs>
    <radialGradient id="body" cx="42%" cy="34%" r="75%">
      <stop offset="0%" stop-color="#ffb35c"/>
      <stop offset="55%" stop-color="#f07f2e"/>
      <stop offset="100%" stop-color="#c2521a"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#0097b9"/>
    </linearGradient>
  </defs>
  <!-- AR ring -->
  <circle cx="512" cy="560" r="400" fill="none" stroke="url(#ring)" stroke-width="44"/>
  <!-- horns -->
  <path d="M348 268 L300 96 L452 208 Z" fill="#ffe9c9"/>
  <path d="M676 268 L724 96 L572 208 Z" fill="#ffe9c9"/>
  <path d="M348 268 L300 96 L452 208 Z" fill="#000" opacity="0.08"/>
  <path d="M676 268 L724 96 L572 208 Z" fill="#000" opacity="0.08"/>
  <!-- round body -->
  <ellipse cx="512" cy="580" rx="300" ry="288" fill="url(#body)"/>
  <!-- belly shade -->
  <ellipse cx="512" cy="712" rx="196" ry="120" fill="#7a2d0e" opacity="0.35"/>
  <!-- cheek glow -->
  <circle cx="512" cy="560" r="150" fill="#ffd9a0" opacity="0.28"/>
  <!-- minimal face: two eyes + open smile (kept chunky for 16px legibility) -->
  <circle cx="430" cy="540" r="42" fill="#2b1408"/>
  <circle cx="594" cy="540" r="42" fill="#2b1408"/>
  <circle cx="444" cy="526" r="14" fill="#fff"/>
  <circle cx="608" cy="526" r="14" fill="#fff"/>
  <path d="M442 640 Q512 706 582 640 Q512 668 442 640 Z" fill="#2b1408"/>
</svg>
